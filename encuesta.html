<style>
:root{--azul:#5D7DA3;--tinta:#34507A;--rosa:#F6B2B6;--rosav:#E3A0AD;--beige:#CBBBA0;--dorado:#F3D9A0;--rosac:#F1CAC3;--papel:#FBF7F2}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--papel);color:var(--tinta);font-family:Ubuntu,system-ui,sans-serif;font-weight:300}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;min-height:100vh;padding:20px 22px 28px;display:flex;flex-direction:column}
.barra{height:4px;background:#ECE4DA;border-radius:4px;overflow:hidden;margin-bottom:28px}
.barra i{display:block;height:100%;width:0;background:var(--azul);transition:width .35s}
.paso{flex:1;display:flex;flex-direction:column;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-weight:300;font-size:30px;line-height:1.25;text-align:center}
h2{font-weight:400;font-size:24px;line-height:1.3;margin-bottom:6px}
.ayuda{font-size:16px;color:#6B7F99;margin-bottom:20px;line-height:1.4}
p.txt{font-size:18px;line-height:1.5;text-align:center;margin-top:16px}
b,.m{font-weight:500}
.ops{display:flex;flex-direction:column;gap:10px}
.op{font:inherit;font-size:18px;font-weight:400;color:var(--tinta);background:#fff;border:1.5px solid #E2D8CC;border-radius:16px;padding:15px 16px;text-align:left;cursor:pointer;transition:all .15s}
.op.sel{border-color:var(--azul);background:#EEF2F8;color:var(--tinta)}
.escala{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.escala .op{width:calc(20% - 5px);text-align:center;padding:14px 0}
.emojis .op{font-size:30px;padding:10px 0}
.extremos{display:flex;justify-content:space-between;font-size:14px;color:#6B7F99;margin-top:8px}
textarea,input[type=text],input[type=tel]{font:inherit;font-size:18px;font-weight:400;color:var(--tinta);width:100%;border:1.5px solid #E2D8CC;border-radius:16px;padding:14px 16px;background:#fff;outline:none}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{border-color:var(--azul)}
.o{text-align:center;color:#6B7F99;font-size:15px;margin:12px 0}
.mic{font:inherit;font-size:18px;font-weight:500;width:100%;border:none;border-radius:16px;padding:15px;background:var(--rosac);color:var(--tinta);cursor:pointer}
.mic.grabando{background:var(--rosav);color:#fff;animation:late 1.2s infinite}
@keyframes late{50%{opacity:.75}}
audio{width:100%;margin-top:10px}
.borrar{font:inherit;background:none;border:none;color:#6B7F99;text-decoration:underline;margin-top:6px;cursor:pointer;font-size:15px}
.pie{margin-top:auto;padding-top:24px;display:flex;gap:10px}
.btn{font:inherit;font-size:18px;font-weight:500;flex:1;border:none;border-radius:16px;padding:16px;background:var(--azul);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.sec{flex:0 0 auto;background:none;color:var(--azul);padding:16px 10px}
.saltar{font:inherit;background:none;border:none;color:#6B7F99;font-size:15px;margin-top:12px;cursor:pointer;text-decoration:underline}
.cq{display:block;width:44px;margin:22px auto 0}
.dib{display:block;margin:0 auto 18px}
.codigo{font-size:34px;font-weight:500;letter-spacing:4px;color:var(--azul);text-align:center;margin:18px 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;margin-top:14px}
.check input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--azul)}
.wa{flex:0 0 auto;display:block;text-align:center;text-decoration:none;margin-top:14px}
.err{color:#B5546A;font-size:15px;text-align:center;margin-top:10px}
</style>

function alAleman(t) {
  const k = t.trim(); if (!k) return t;
  if (T_DE[k]) return t.replace(k, T_DE[k]);
  let m;
  if ((m = k.match(/^← (.+)$/)) && T_DE[m[1]]) return '← ' + T_DE[m[1]];
  if ((m = k.match(/^(.+) →$/)) && T_DE[m[1]]) return T_DE[m[1]] + ' →';
  if ((m = k.match(/^Entre € ([\d.]+) y ([\d.]+)$/))) return 'Zwischen ' + m[1] + ' und ' + m[2] + ' €';
  if (k.includes('€')) return k.replace(/€ ([\d.]+)/g, '$1 €').replace(/^Hasta /, 'Bis ').replace(/^Entre /, 'Zwischen ').replace(/ y /, ' und ').replace(/^Más de /, 'Mehr als ');
  return t;
}

    return;
  }
  const p = pais(); if (!p || VOSEO.includes(p)) return;

  while ((n = w.nextNode())) { let t = n.nodeValue; TU.forEach(([a, b]) => t = t.replace(a, b)); if (t !== n.nodeValue) n.nodeValue = t; }
  raiz.querySelectorAll('textarea').forEach(x => x.placeholder = x.placeholder.replace('Escribí', 'Escribe'));
}

function ir(id, atras) { if (!atras && actual !== id) hist.push(actual); actual = id; pintar(); window.scrollTo(0, 0); }

// ---------- Audio ----------
function grabador(clave, cambio) {
  const box = el('div');
  function render() {
    box.innerHTML = '';
    if (AUD[clave]) {
      const a = el('audio', {controls:''}); a.src = URL.createObjectURL(AUD[clave].blob);
      box.append(el('div', {class:'ayuda', style:'margin:0;text-align:center'}, '🎧 Tu audio quedó guardado'), a, el('button', {class:'borrar', onclick:() => { delete AUD[clave]; render(); cambio(); }}, 'Borrar y grabar de nuevo'));
      return;
    }
    const puede = navigator.mediaDevices && window.MediaRecorder;
    const btn = el('button', {class:'mic'}, '🎙 Grabar un audio');
    const archivo = el('input', {type:'file', accept:'audio/*', capture:'', style:'display:none'});
    archivo.addEventListener('change', () => { const f = archivo.files[0]; if (f) { AUD[clave] = {blob:f, tipo:f.type || 'audio/mpeg', ext:(f.name.split('.').pop() || 'm4a')}; render(); cambio(); } });
    let rec = null, partes = [];
    btn.addEventListener('click', async () => {
      if (rec) { rec.stop(); return; }
      if (!puede) { archivo.click(); return; }
      try {
        const st = await navigator.mediaDevices.getUserMedia({audio:true});
        partes = []; rec = new MediaRecorder(st);
        rec.ondataavailable = e => partes.push(e.data);
        rec.onstop = () => { st.getTracks().forEach(t => t.stop()); const tipo = rec.mimeType || 'audio/webm'; AUD[clave] = {blob:new Blob(partes, {type:tipo}), tipo:tipo, ext:tipo.includes('mp4') ? 'm4a' : 'webm'}; rec = null; render(); cambio(); };
        rec.start(); btn.textContent = '⏹ Tocá para terminar'; btn.classList.add('grabando');
      } catch (e) { archivo.click(); }
    });
    box.append(btn, archivo);
  }
  render(); return box;
}

// ---------- Envío ----------
function b64(blob) { return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = mal; r.readAsDataURL(blob); }); }
function codigoNuevo() { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = 'MIA-'; for (let i = 0; i < 4; i++) c += L.charAt(Math.floor(Math.random() * L.length)); return c; }
async function api(cuerpo) {
  const url = (window.CONFIG || {}).SCRIPT_URL; let ult;
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo), redirect:'follow'}); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'error'); return j; }
    catch (e) { ult = e; await new Promise(ok => setTimeout(ok, 1200 * (i + 1))); }
  }
  throw ult;
}
const escH = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function mandar() {
  const codigo = codigoNuevo();
  const respuestas = {}; for (const k in R) respuestas[k] = R[k];
  for (const k in AUD) respuestas[k] = (respuestas[k] ? respuestas[k] + ' ' : '') + '[🎙 audio]';
  const nombre = datosAviso.nombre || 'Anónima';
  const ficha = {tipo:'encuesta', nacio:'si', bebe_nombre:'📝 Encuesta · ' + codigo, quien_nombre:nombre, whatsapp:datosAviso.whatsapp || '', quiere_aviso:datosAviso.aviso ? 'sí' : 'no', regalo:R[KREG] === REG_RES ? 'resultados' : DE ? 'ninguno' : 'beneficio', idioma:DE ? 'alemán' : 'español', codigo, respuestas};
  const lineas = Object.keys(respuestas).map(k => k + '\n→ ' + respuestas[k]);
  const texto = 'Encuesta para mamás · código ' + codigo + (DE ? ' · en alemán' : '') + (R[KREG] === REG_RES ? ' · quiere los resultados' : '') + (datosAviso.aviso ? ' · quiere aviso' : '') + '\n\n' + lineas.join('\n\n');
  const html = '<h3>Encuesta para mamás · ' + codigo + '</h3>' + Object.keys(respuestas).map(k => '<p><b>' + escH(k) + '</b><br>' + escH(respuestas[k]) + '</p>').join('');
  const url = (window.CONFIG || {}).SCRIPT_URL;
  if (!url) { console.log('Modo prueba:', ficha); return {codigo}; }
  const {id} = await api({accion:'enviar', ficha, resumen:{prioridad:'Encuesta', texto, html}});
  for (const k in AUD) {
    try { await api({accion:'subir', id, clase:'audio', pregunta:k, etiqueta:k.slice(0, 50), tipo:AUD[k].tipo, ext:AUD[k].ext, datos:await b64(AUD[k].blob)}); } catch (e) { }
  }
  return {codigo};
}
