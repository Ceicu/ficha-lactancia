<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fotos para tu evaluación · Ceci Quevedo</title>
<meta name="description" content="Guía paso a paso para sacar y enviar las fotos de tu evaluación con la Lic. Cecilia Quevedo.">
<meta property="og:title" content="Fotos para tu evaluación · Ceci Quevedo">
<meta property="og:description" content="Seguí los dibujitos, sacá las fotos y mandámelas desde acá mismo 📷">
<meta name="theme-color" content="#5D7DA3">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@1,700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  .dib{background:var(--papel);border-radius:12px;padding:6px}
  .dib svg{display:block;width:100%;height:auto}
  .par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .par .tarjeta,.trio .tarjeta{margin:0;padding:8px}
  .lab{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-top:6px}
  .lab svg{flex:none}
  .mini{font-size:14px;line-height:1.35;margin:6px 2px 0}
  .reglas .tarjeta{margin:8px 0;padding:12px 14px;font-size:15px}
  .reglas b.t{display:block;color:var(--azul)}
  .mats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mat{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:var(--sombra);font-size:14px;line-height:1.2}
  .mat svg{flex:none}
  .mat span{display:block;color:var(--gris);font-size:12.5px;margin-top:2px}
  .foto-card .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;font-weight:700;display:grid;place-items:center}
  .foto-card.lista .num{background:var(--verde)}
  .foto-card h3{margin:0;font-size:18px;line-height:1.2}
  .tag{display:inline-block;background:var(--rosa);border-radius:10px;padding:1px 9px;font-size:12.5px;font-weight:700;margin-top:4px}
  .foto-card .cuerpo{display:grid;grid-template-columns:44% 1fr;gap:12px;align-items:center}
  .foto-card ul{margin:0;padding-left:18px;font-size:15px}
  .foto-card li{margin-bottom:4px}
  .fotos-grid{grid-template-columns:repeat(2,1fr)}
  .foto{aspect-ratio:3/4}
  .estado-fotos{font-size:14px;margin-top:2px}
  .cuenta{font-weight:700}
  @media (max-width:380px){ .foto-card .cuerpo{grid-template-columns:1fr} .mats{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="cabecera">
  <div class="envoltura">
    <div class="fila">
      <div class="iso" id="iso"></div>
      <div>
        <h1>Fotos para tu evaluación</h1>
        <div class="sub">Ceci Quevedo · Fono</div>
      </div>
    </div>
    <div class="progreso"><i id="progreso"></i></div>
    <div class="paso-txt" id="paso-txt"></div>
  </div>
</header>
<main class="envoltura" id="contenido"></main>
<nav class="barra" id="barra">
  <div class="envoltura">
    <button class="btn prim" id="enviar" type="button" disabled>Enviar fotos a Ceci</button>
  </div>
</nav>
<script src="config.js"></script>
<script src="comun.js"></script>
<script src="fotos-dibujos.js"></script>
<script src="fotos.js"></script>
</body>
</html>
